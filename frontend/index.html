<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAT · Repository Analysis Tool</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cpath d='M10 22V10h7a4 4 0 0 1 0 8h-4l5 4' stroke='%230a0f1f' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/" title="All repositories">
    <span class="brand-mark">R</span>
    <span class="brand-name">RAT<em>Repository Analysis Tool</em></span>
  </a>

  <div class="topbar-repo" id="repo-switch"></div>

  <nav class="tabs" id="tabs" hidden>
    <a data-view="overview" href="#/">Overview</a>
    <a data-view="browse" href="#/">Explorer</a>
    <a data-view="commits" href="#/">Commits</a>
    <a data-view="authors" href="#/">Authors</a>
  </nav>

  <div class="topbar-right">
    <div class="global-search" id="global-search-wrap">
      <input id="global-search" type="search" placeholder="Search files, dirs, commits   /"
             autocomplete="off" spellcheck="false" aria-label="Search repository content">
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <a class="btn btn-primary" href="#/add">+ Add repository</a>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer id="footer">
  <span id="footer-filters"></span>
  <span class="footer-right"><span id="footer-status"></span> · RAT v1</span>
</footer>

<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
